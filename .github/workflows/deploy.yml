name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: promsearch-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-push:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/promsearch:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/promsearch:${{ github.event.workflow_run.head_sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          SWAGGER_ENABLE: ${{ secrets.SWAGGER_ENABLE }}
          SWAGGER_AUTH_USERNAME: ${{ secrets.SWAGGER_AUTH_USERNAME }}
          SWAGGER_AUTH_PASSWORD: ${{ secrets.SWAGGER_AUTH_PASSWORD }}
          SERVER_FORWARD_HEADERS_STRATEGY: FRAMEWORK
          OPENAPI_SERVER_URL: https://api.promsearch.kr
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          SPRING_FLYWAY_ENABLED: ${{ secrets.SPRING_FLYWAY_ENABLED }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_REGION: ap-northeast-2
          AWS_SQS_WATERMARK_ENABLED: ${{ secrets.AWS_SQS_WATERMARK_ENABLED }}
          AWS_SQS_WATERMARK_QUEUE_URL: ${{ secrets.AWS_SQS_WATERMARK_QUEUE_URL }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 30s
          command_timeout: 12m
          envs: JWT_ACCESS_SECRET,JWT_REFRESH_SECRET,SWAGGER_ENABLE,SWAGGER_AUTH_USERNAME,SWAGGER_AUTH_PASSWORD,SERVER_FORWARD_HEADERS_STRATEGY,OPENAPI_SERVER_URL,KAKAO_CLIENT_ID,KAKAO_CLIENT_SECRET,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,SPRING_DATASOURCE_URL,SPRING_DATASOURCE_USERNAME,SPRING_DATASOURCE_PASSWORD,SPRING_FLYWAY_ENABLED,AWS_S3_BUCKET,AWS_REGION,AWS_SQS_WATERMARK_ENABLED,AWS_SQS_WATERMARK_QUEUE_URL
          script: |
            set -eu

            if [ "$AWS_SQS_WATERMARK_ENABLED" != "true" ] || [ -z "$AWS_SQS_WATERMARK_QUEUE_URL" ]; then
              echo "Worker deployment requires enabled SQS watermark configuration."
              exit 1
            fi

            IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/promsearch:${{ github.event.workflow_run.head_sha }}
            API_PREVIOUS=false
            API_NEW=false
            WORKER_PREVIOUS_NAMES=""
            WORKER_NEW_NAMES=""
            ROLLBACK_REQUIRED=false

            rollback() {
              if [ "$API_NEW" = "true" ]; then
                docker rm -f promsearch || true
              fi
              for worker_name in $WORKER_NEW_NAMES; do
                docker rm -f "$worker_name" || true
              done
              if [ "$API_PREVIOUS" = "true" ]; then
                docker rename promsearch-previous promsearch || true
                docker start promsearch || true
              fi
              for worker_previous_name in $WORKER_PREVIOUS_NAMES; do
                worker_name=${worker_previous_name%-previous}
                docker rename "$worker_previous_name" "$worker_name" || true
                docker start "$worker_name" || true
              done
            }

            rollback_on_exit() {
              exit_status=$?
              if [ "$ROLLBACK_REQUIRED" = "true" ]; then
                rollback
              fi
              exit "$exit_status"
            }
            trap rollback_on_exit EXIT
            trap 'exit 1' HUP INT TERM

            timeout 4m docker pull "$IMAGE"
            docker rm -f promsearch-previous promsearch-worker-previous \
              promsearch-worker-1-previous promsearch-worker-2-previous || true
            ROLLBACK_REQUIRED=true
            if docker container inspect promsearch >/dev/null 2>&1; then
              docker rename promsearch promsearch-previous
              API_PREVIOUS=true
              docker stop --time 20 promsearch-previous
            fi
            for worker_name in promsearch-worker promsearch-worker-1 promsearch-worker-2; do
              if docker container inspect "$worker_name" >/dev/null 2>&1; then
                worker_previous_name="${worker_name}-previous"
                docker rename "$worker_name" "$worker_previous_name"
                WORKER_PREVIOUS_NAMES="$WORKER_PREVIOUS_NAMES $worker_previous_name"
                docker stop --time 20 "$worker_previous_name"
              fi
            done

            API_NEW=true
            if ! docker run -d --name promsearch --restart unless-stopped \
              --log-opt max-size=10m --log-opt max-file=3 -p 8080:8080 \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e SPRING_DATASOURCE_URL="$SPRING_DATASOURCE_URL" \
              -e SPRING_DATASOURCE_USERNAME="$SPRING_DATASOURCE_USERNAME" \
              -e SPRING_DATASOURCE_PASSWORD="$SPRING_DATASOURCE_PASSWORD" \
              -e SPRING_FLYWAY_ENABLED="${SPRING_FLYWAY_ENABLED:-false}" \
              -e JWT_ACCESS_SECRET="$JWT_ACCESS_SECRET" \
              -e JWT_REFRESH_SECRET="$JWT_REFRESH_SECRET" \
              -e SWAGGER_ENABLE="$SWAGGER_ENABLE" \
              -e SWAGGER_AUTH_USERNAME="$SWAGGER_AUTH_USERNAME" \
              -e SWAGGER_AUTH_PASSWORD="$SWAGGER_AUTH_PASSWORD" \
              -e SERVER_FORWARD_HEADERS_STRATEGY="$SERVER_FORWARD_HEADERS_STRATEGY" \
              -e OPENAPI_SERVER_URL="$OPENAPI_SERVER_URL" \
              -e KAKAO_CLIENT_ID="$KAKAO_CLIENT_ID" \
              -e KAKAO_CLIENT_SECRET="$KAKAO_CLIENT_SECRET" \
              -e GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
              -e GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET" \
              -e AWS_S3_BUCKET="$AWS_S3_BUCKET" \
              -e AWS_REGION="$AWS_REGION" \
              -e AWS_SQS_WATERMARK_ENABLED="$AWS_SQS_WATERMARK_ENABLED" \
              -e AWS_SQS_WATERMARK_QUEUE_URL="$AWS_SQS_WATERMARK_QUEUE_URL" \
              "$IMAGE"; then
              exit 1
            fi

            API_HEALTH=starting
            for attempt in $(seq 1 18); do
              API_RUNNING=$(timeout 5s docker inspect --format='{{.State.Running}}' promsearch 2>/dev/null || true)
              if [ "$API_RUNNING" != "true" ]; then
                break
              fi
              API_HEALTH=$(timeout 5s docker inspect --format='{{.State.Health.Status}}' promsearch 2>/dev/null || true)
              if [ "$API_HEALTH" = "healthy" ]; then
                break
              fi
              if [ "$API_HEALTH" = "unhealthy" ]; then
                break
              fi
              sleep 5
            done
            if [ "$API_HEALTH" != "healthy" ]; then
              timeout 10s docker logs --tail 100 promsearch || true
              exit 1
            fi

            for worker_name in promsearch-worker-1 promsearch-worker-2; do
              if ! docker run -d --name "$worker_name" --restart unless-stopped --no-healthcheck \
                --log-opt max-size=10m --log-opt max-file=3 \
                -e SPRING_PROFILES_ACTIVE=prod \
                -e SPRING_DATASOURCE_URL="$SPRING_DATASOURCE_URL" \
                -e SPRING_DATASOURCE_USERNAME="$SPRING_DATASOURCE_USERNAME" \
                -e SPRING_DATASOURCE_PASSWORD="$SPRING_DATASOURCE_PASSWORD" \
                -e SPRING_JPA_HIBERNATE_DDL_AUTO=none \
                -e AWS_S3_BUCKET="$AWS_S3_BUCKET" \
                -e AWS_REGION="$AWS_REGION" \
                -e AWS_SQS_WATERMARK_ENABLED="$AWS_SQS_WATERMARK_ENABLED" \
                -e AWS_SQS_WATERMARK_QUEUE_URL="$AWS_SQS_WATERMARK_QUEUE_URL" \
                "$IMAGE" worker.jar; then
                exit 1
              fi
              WORKER_NEW_NAMES="$WORKER_NEW_NAMES $worker_name"
            done

            for worker_name in $WORKER_NEW_NAMES; do
              WORKER_READY=false
              for attempt in $(seq 1 12); do
                WORKER_RUNNING=$(timeout 5s docker inspect --format='{{.State.Running}}' "$worker_name" 2>/dev/null || true)
                if [ "$WORKER_RUNNING" != "true" ]; then
                  break
                fi
                WORKER_LOGS=$(timeout 5s docker logs --tail 200 "$worker_name" 2>&1 || true)
                if printf '%s\n' "$WORKER_LOGS" | grep -q 'prompt_image_watermark_sqs_poll_ready'; then
                  WORKER_READY=true
                  break
                fi
                echo "Worker ${worker_name} readiness check ${attempt}/12"
                sleep 5
              done
              if [ "$WORKER_READY" != "true" ]; then
                timeout 10s docker logs --tail 200 "$worker_name" || true
                exit 1
              fi
            done

            ROLLBACK_REQUIRED=false
            trap - EXIT
            docker rm promsearch-previous $WORKER_PREVIOUS_NAMES || true
            timeout 1m docker image prune -f || true

      - name: Notify Discord on failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{\"content\": \"🚨 **배포 실패** — [로그 확인](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\"}" \
               ${{ secrets.DISCORD_WEBHOOK }}
