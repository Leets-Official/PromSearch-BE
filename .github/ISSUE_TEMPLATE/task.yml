name: "Task"
description: 여러 하위 작업을 묶는 상위 작업입니다.
title: "[Task] "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        큰 단위의 작업을 관리할 때 사용해주세요.
        구현 이슈는 가능한 Feature, Bug, Refactor, Chore, Docs로 분리하는 것을 권장합니다.

  - type: textarea
    id: description
    attributes:
      label: 어떤 작업인가요?
      description: 목표와 배경을 작성해주세요.
      placeholder: |
        e.g. 프롬프트 MVP 핵심 도메인(prompt, point, tracking) 초기 골격을 구성합니다.
    validations:
      required: true

  - type: textarea
    id: todo
    attributes:
      label: TODO
      description: 하위 작업을 체크리스트로 작성해주세요.
      placeholder: |
        - [ ] prompt 도메인 패키지 생성
        - [ ] point 도메인 패키지 생성
        - [ ] tracking 이벤트 로그 정책 정리
    validations:
      required: true

  - type: input
    id: related
    attributes:
      label: 관련 이슈
      description: 연관된 이슈가 있다면 번호를 입력해주세요.
      placeholder: "e.g. #123, #456"
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 제출 전 확인사항
      options:
        - label: 동일하거나 유사한 이슈가 없는지 확인했습니다.
          required: true
        - label: 하위 작업을 작은 이슈로 나눌 수 있는지 확인했습니다.
          required: true
        - label: 적절한 라벨과 Assignee를 설정했습니다.
          required: false

