name: "Bug"
description: 예상하지 못한 오류를 제보합니다.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        재현 가능한 형태로 작성해주세요.
        개인정보, 토큰, 유료 프롬프트 원문 등 민감 정보는 반드시 마스킹해주세요.

  - type: textarea
    id: description
    attributes:
      label: 어떤 버그인가요?
      description: 버그 상황을 간결하게 설명해주세요.
      placeholder: |
        e.g. PREMIUM 프롬프트 상세 조회 시 언락하지 않은 사용자에게 promptBody 전체가 반환됩니다.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 버그를 재현할 수 있는 단계를 순서대로 작성해주세요.
      placeholder: |
        1. 테스트 계정으로 로그인
        2. 언락하지 않은 PREMIUM 프롬프트 상세 조회 API 호출
        3. 응답 body 확인
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대 동작
      description: 정상적으로 동작했다면 어떤 결과가 나와야 했나요?
      placeholder: e.g. 유료 프롬프트 본문은 preview 또는 maskedBody만 반환되어야 합니다.
    validations:
      required: true

  - type: input
    id: endpoint
    attributes:
      label: 관련 API
      description: 문제가 발생한 엔드포인트를 입력해주세요.
      placeholder: e.g. GET /api/v1/prompts/{promptId}
    validations:
      required: false

  - type: input
    id: error_code
    attributes:
      label: 에러 코드
      description: 응답에 포함된 에러 코드가 있다면 입력해주세요.
      placeholder: e.g. PROMPT-404
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 추가 정보
      description: 로그, cURL, 요청/응답 예시, 발생 일시 등을 첨부해주세요.
      placeholder: |
        - 발생 일시:
        - cURL:
        - 로그:
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 제출 전 확인사항
      options:
        - label: 동일하거나 유사한 이슈가 없는지 확인했습니다.
          required: true
        - label: 민감한 정보를 마스킹했습니다.
          required: true
        - label: 적절한 라벨과 Assignee를 설정했습니다.
          required: false

