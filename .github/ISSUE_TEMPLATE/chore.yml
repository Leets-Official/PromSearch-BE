name: "Chore"
description: 빌드, CI/CD, 환경 설정 등 코드 로직 외 작업입니다.
title: "[Chore] "
labels: ["chore"]
body:
  - type: markdown
    attributes:
      value: |
        빌드 스크립트, 의존성, CI/CD, Docker, 환경 변수, GitHub 설정 등에 사용해주세요.

  - type: textarea
    id: description
    attributes:
      label: 작업 내용
      description: 무엇을, 왜 해야 하는지 작성해주세요.
      placeholder: |
        e.g. 로컬 개발용 Docker Compose에 PostgreSQL과 Redis를 추가합니다.
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: 작업이 필요한 이유
      description: 배경과 기대 효과를 작성해주세요.
      placeholder: |
        e.g. 팀원이 동일한 DB/캐시 환경에서 개발할 수 있도록 표준 실행 환경이 필요합니다.
    validations:
      required: false

  - type: textarea
    id: impact
    attributes:
      label: 영향 범위
      description: 이 작업으로 영향을 받을 수 있는 범위를 작성해주세요.
      placeholder: |
        e.g. 로컬 개발 환경, GitHub Actions, 배포 파이프라인
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 제출 전 확인사항
      options:
        - label: 동일하거나 유사한 이슈가 없는지 확인했습니다.
          required: true
        - label: 애플리케이션 로직 변경이 없는 작업임을 확인했습니다.
          required: true
        - label: 적절한 라벨과 Assignee를 설정했습니다.
          required: false

