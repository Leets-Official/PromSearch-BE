name: "Refactor"
description: 기능 변경 없이 기존 코드를 개선합니다.
title: "[Refactor] "
labels: ["refactor"]
body:
  - type: markdown
    attributes:
      value: |
        기능 변경 없이 코드 품질, 구조, 성능을 개선하는 경우에 사용해주세요.

  - type: textarea
    id: target
    attributes:
      label: 개선 대상
      description: 개선하려는 코드, 모듈, 계층을 작성해주세요.
      placeholder: e.g. `prompt.application`의 상세 조회 로직
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: 개선이 필요한 이유
      description: 현재 구조의 문제나 개선 필요성을 작성해주세요.
      placeholder: |
        e.g. Controller에서 유료 콘텐츠 마스킹 여부를 판단하고 있어 비즈니스 규칙이 분산되어 있습니다.
    validations:
      required: true

  - type: textarea
    id: approach
    attributes:
      label: 개선 방법
      description: 어떻게 개선할지 작성해주세요.
      placeholder: |
        e.g. 마스킹 정책을 domain service로 이동하고, application 계층에서 결과 DTO로 변환합니다.
    validations:
      required: true

  - type: textarea
    id: todo
    attributes:
      label: TODO
      description: 세부 작업을 체크리스트로 작성해주세요.
      placeholder: |
        - [ ] 도메인 메서드 추가
        - [ ] UseCase 변경
        - [ ] 테스트 보강
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 제출 전 확인사항
      options:
        - label: 동일하거나 유사한 이슈가 없는지 확인했습니다.
          required: true
        - label: 기능 변경이 없는 순수 리팩토링임을 확인했습니다.
          required: true
        - label: 적절한 라벨과 Assignee를 설정했습니다.
          required: false

