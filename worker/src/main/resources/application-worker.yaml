spring:
  application:
    name: promsearch-image-worker
  main:
    web-application-type: none
  datasource:
    # 별도 JVM인 API와 Worker는 같은 외부 DB를 사용해야 한다. 인메모리 H2는 프로세스 간 공유되지 않는다.
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    # TODO: Worker 프로세스 수 × 처리 동시성을 기준으로 전용 Hikari 풀을 산정하고,
    # API 풀과 합친 값이 PostgreSQL 연결 예산을 넘지 않도록 아래 항목을 활성화
    # hikari:
    #   maximum-pool-size: ${DB_WORKER_MAXIMUM_POOL_SIZE:4}
    #   minimum-idle: ${DB_WORKER_MINIMUM_IDLE:1}
    #   connection-timeout: ${DB_WORKER_CONNECTION_TIMEOUT_MS:3000}
    #   max-lifetime: ${DB_WORKER_MAX_LIFETIME_MS:1800000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
  flyway:
    # 스키마 마이그레이션은 API 컨테이너가 전담하고, Worker는 준비된 스키마만 사용한다.
    enabled: false

storage:
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_REGION:ap-northeast-2}
    original-prefix: ${AWS_S3_ORIGINAL_PREFIX:prompt-images/original}
    watermarked-prefix: ${AWS_S3_WATERMARKED_PREFIX:prompt-images/watermarked}
    upload-url-expiration: ${AWS_S3_UPLOAD_URL_EXPIRATION:10m}

messaging:
  sqs:
    watermark:
      enabled: ${AWS_SQS_WATERMARK_ENABLED:false}
      queue-url: ${AWS_SQS_WATERMARK_QUEUE_URL:}
      publisher-batch-size: ${AWS_SQS_WATERMARK_PUBLISHER_BATCH_SIZE:10}
      publisher-poll-delay-milliseconds: ${AWS_SQS_WATERMARK_PUBLISHER_POLL_DELAY_MS:1000}
      claim-lease: ${AWS_SQS_WATERMARK_CLAIM_LEASE:60s}
      initial-retry-delay: ${AWS_SQS_WATERMARK_INITIAL_RETRY_DELAY:5s}
      maximum-retry-delay: ${AWS_SQS_WATERMARK_MAXIMUM_RETRY_DELAY:5m}
      worker-poll-delay-milliseconds: ${AWS_SQS_WATERMARK_WORKER_POLL_DELAY_MS:200}
      receive-wait-time-seconds: ${AWS_SQS_WATERMARK_RECEIVE_WAIT_SECONDS:20}
      # TODO: 실제 처리 시간 p99보다 길게 유지하고, 대용량 이미지가 이 값을 넘으면
      # ChangeMessageVisibility heartbeat를 추가해 동일 메시지의 동시 재처리를 방지
      visibility-timeout-seconds: ${AWS_SQS_WATERMARK_VISIBILITY_TIMEOUT_SECONDS:120}

worker:
  watermark:
    # TODO: 현재 소비기는 메모리 상한을 위해 1건씩 순차 처리한다. 병렬 처리 도입 시
    # 동시성 × 디코딩 픽셀 메모리 × 안전계수, JVM heap, S3/DB 풀을 함께 측정해 적용
    concurrency: ${WATERMARK_WORKER_CONCURRENCY:1}
    # 병렬 처리 설정 형태 예시. 실행기 구현을 추가하기 전까지는 주석 해제하지 않는다.
    # executor:
    #   core-pool-size: ${WATERMARK_EXECUTOR_CORE_POOL_SIZE:2}
    #   max-pool-size: ${WATERMARK_EXECUTOR_MAX_POOL_SIZE:4}
    #   queue-capacity: ${WATERMARK_EXECUTOR_QUEUE_CAPACITY:8}
    logo: classpath:watermark/wordmark.png
    logo-color: "${WATERMARK_LOGO_COLOR:#6B7280}"
    opacity: ${WATERMARK_OPACITY:0.26}
    logo-width-ratio: ${WATERMARK_LOGO_WIDTH_RATIO:0.095}
    minimum-logo-width: ${WATERMARK_MINIMUM_LOGO_WIDTH:80}
    maximum-logo-width: ${WATERMARK_MAXIMUM_LOGO_WIDTH:240}
    horizontal-gap-ratio: ${WATERMARK_HORIZONTAL_GAP_RATIO:0.123}
    vertical-gap-ratio: ${WATERMARK_VERTICAL_GAP_RATIO:0.21}
    horizontal-margin-ratio: ${WATERMARK_HORIZONTAL_MARGIN_RATIO:0.018}
    vertical-margin-ratio: ${WATERMARK_VERTICAL_MARGIN_RATIO:0.028}
    jpeg-quality: ${WATERMARK_JPEG_QUALITY:0.92}
    maximum-output-bytes: ${WATERMARK_MAXIMUM_OUTPUT_BYTES:10485760}
