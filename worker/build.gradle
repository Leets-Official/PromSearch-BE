plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.promsearch'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation project(':')
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation platform('software.amazon.awssdk:bom:2.49.3')
	implementation 'software.amazon.awssdk:s3'
	implementation 'software.amazon.awssdk:url-connection-client'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.postgresql:postgresql'

	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

springBoot {
	mainClass = 'com.promsearch.worker.PromSearchImageWorkerApplication'
}

tasks.named('test') {
	useJUnitPlatform()
}

/* API와 동일한 로컬 .env를 Worker bootRun에도 주입한다. 별도 JVM이므로 외부 DB URL이 필요하다. */
tasks.named('bootRun') {
	def envFile = rootProject.file('.env')
	if (envFile.exists()) {
		environment envFile.readLines()
				.findAll { line -> line.trim() && !line.trim().startsWith('#') && line.contains('=') }
				.collectEntries { line ->
					int separatorIndex = line.indexOf('=')
					[(line.substring(0, separatorIndex).trim()): line.substring(separatorIndex + 1).trim()]
				}
				.findAll { key, value -> value }
	}
}
