plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.promsearch'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.flywaydb:flyway-core'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	/* S3 Presigned URL 발급과 업로드 완료 검증에 AWS SDK for Java 2.x를 사용한다. */
	implementation platform('software.amazon.awssdk:bom:2.49.3')
	implementation 'software.amazon.awssdk:s3'
	implementation 'software.amazon.awssdk:sqs'
	/* 로컬에서는 IAM Identity Center 프로필, 배포 환경에서는 실행 Role을 기본 자격 증명 체인으로 읽는다. */
	implementation 'software.amazon.awssdk:sso'
	implementation 'software.amazon.awssdk:ssooidc'
	implementation 'software.amazon.awssdk:url-connection-client'
	/* Swagger 문서 경로만 Basic Auth로 보호하기 위해 Spring Security를 추가한다. */
	implementation 'org.springframework.boot:spring-boot-starter-security'
	/* /docs, /docs-json 문서 생성을 담당한다. 실제 노출 여부는 application.yaml의 SWAGGER_ENABLE로 제어한다. */
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'
	/* dev/prod에서 MDC 기반 구조화 JSON 로그를 출력한다. */
	implementation 'net.logstash.logback:logstash-logback-encoder:8.1'
	implementation 'org.springframework.security:spring-security-crypto'
	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	/* Swagger Basic Auth 접근 제어를 MockMvc에서 검증한다. */
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('bootJar') {
	archiveFileName = 'promsearch-api.jar'
}

/* 로컬 실행 시 .env가 있으면 bootRun에만 자동으로 주입한다 (커밋되지 않는 파일, CI/배포엔 영향 없음). */
tasks.named('bootRun') {
	def envFile = file('.env')
	if (envFile.exists()) {
		environment envFile.readLines()
				.findAll { line -> line.trim() && !line.trim().startsWith('#') && line.contains('=') }
				.collectEntries { line ->
					int separatorIndex = line.indexOf('=')
					[(line.substring(0, separatorIndex).trim()): line.substring(separatorIndex + 1).trim()]
				}
				.findAll { key, value -> value }
	}
}
