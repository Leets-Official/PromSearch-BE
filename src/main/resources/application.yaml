server:
  port: ${SERVER_PORT:8080}
  # 종료 신호를 받으면 진행 중인 요청을 마친 뒤 종료한다.
  shutdown: graceful
  # ALB/Nginx처럼 신뢰할 수 있는 프록시 뒤에서만 FRAMEWORK로 변경한다.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:NONE}
  tomcat:
    threads:
      # CPU 사용률·응답 지연·Hikari pending 수를 함께 보고 조정한다.
      max: ${SERVER_TOMCAT_THREADS_MAX:200}
      min-spare: ${SERVER_TOMCAT_THREADS_MIN_SPARE:10}
    max-connections: ${SERVER_TOMCAT_MAX_CONNECTIONS:8192}
    # 모든 처리 스레드가 사용 중일 때 대기시킬 요청 수다.
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:100}

spring:
  application:
    name: promsearch
  lifecycle:
    # 현재 Docker stop 기본 유예 시간(10초) 안에 종료되도록 둔다.
    timeout-per-shutdown-phase: ${SPRING_LIFECYCLE_SHUTDOWN_TIMEOUT:9s}
  jackson:
    time-zone: ${RESPONSE_TIME_ZONE:Asia/Seoul}
  datasource:
    hikari:
      auto-commit: true
      # API·Worker 풀 합계가 PostgreSQL max_connections의 70~80% 이내인지 부하 테스트로 튜닝한다.
      maximum-pool-size: ${DB_API_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${DB_API_MINIMUM_IDLE:2}
      # DB 장애 시 요청 스레드가 오래 대기하지 않도록 짧게 실패한다.
      connection-timeout: ${DB_API_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${DB_API_VALIDATION_TIMEOUT_MS:1000}
      # RDS·네트워크의 유휴 연결 정리 정책을 보며 튜닝한다.
      idle-timeout: ${DB_API_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DB_API_MAX_LIFETIME_MS:1800000}
      keepalive-time: ${DB_API_KEEPALIVE_TIME_MS:60000}
      # 배포 시 DB 접속 실패를 즉시 감지하도록 fail-fast로 둔다.
      initialization-fail-timeout: ${DB_API_INITIALIZATION_FAIL_TIMEOUT_MS:1}
  jpa:
    # Controller까지 영속성 컨텍스트를 열어 두지 않고 서비스 트랜잭션에서 조회를 끝낸다.
    open-in-view: false
    hibernate:
      # 운영 스키마는 Flyway로만 관리하고 Hibernate가 변경하지 않는다.
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
    properties:
      hibernate:
        default_schema: public
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
        show_sql: ${HIBERNATE_SHOW_SQL:false}
        # 통계 수집은 오버헤드가 있으므로 성능 분석 시에만 활성화한다.
        generate_statistics: ${HIBERNATE_GENERATE_STATISTICS:false}
  flyway:
    # 운영에서는 GitHub Secret으로 true를 전달한다. 새 DB도 baseline-on-migrate는 사용하지 않는다.
    enabled: ${SPRING_FLYWAY_ENABLED:false}
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
    out-of-order: ${SPRING_FLYWAY_OUT_OF_ORDER:false}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLE:false}
    path: /docs-json
  swagger-ui:
    enabled: ${SWAGGER_ENABLE:false}
    path: /docs
    persist-authorization: true
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha
    doc-expansion: none
    disable-swagger-default-url: true
    display-request-duration: true
    filter: true
    deep-linking: true

openapi:
  # 운영 Swagger가 프록시 헤더 누락으로 HTTP URL을 만들지 않도록, 배포 시 HTTPS API 주소를 명시한다.
  server-url: ${OPENAPI_SERVER_URL:}

logging:
  level:
    root: ${LOGGING_ROOT_LEVEL:INFO}
    com.promsearch: ${LOGGING_APP_LEVEL:INFO}
    # 운영 기본값에서는 SQL과 바인딩 값을 숨기고, 장애 분석 때만 DEBUG/TRACE로 올린다.
    org.hibernate.SQL: ${LOGGING_HIBERNATE_SQL_LEVEL:WARN}
    org.hibernate.orm.jdbc.bind: ${LOGGING_HIBERNATE_BIND_LEVEL:WARN}
    org.springframework.transaction: ${LOGGING_TRANSACTION_LEVEL:INFO}
    org.springframework.orm.jpa: ${LOGGING_JPA_LEVEL:INFO}
    com.zaxxer.hikari: ${LOGGING_HIKARI_LEVEL:WARN}

prompt:
  pricing:
    premium-price-point: ${PROMPT_PREMIUM_PRICE_POINT:100}

auth:
  jwt:
    access-secret: ${JWT_ACCESS_SECRET}
    refresh-secret: ${JWT_REFRESH_SECRET}
    access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:3600}
    refresh-token-expiration-seconds: ${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:1209600}
  oauth:
    kakao:
      client-id: ${KAKAO_CLIENT_ID}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      token-uri: https://kauth.kakao.com/oauth/token
      user-info-uri: https://kapi.kakao.com/v2/user/me
    google:
      client-id: ${GOOGLE_CLIENT_ID}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      token-uri: https://oauth2.googleapis.com/token
      user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo

storage:
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_REGION:ap-northeast-2}
    original-prefix: ${AWS_S3_ORIGINAL_PREFIX:prompt-images/original}
    watermarked-prefix: ${AWS_S3_WATERMARKED_PREFIX:prompt-images/watermarked}
    profile-prefix: ${AWS_S3_PROFILE_PREFIX:profiles}
    upload-url-expiration: ${AWS_S3_UPLOAD_URL_EXPIRATION:10m}

# TODO: 이미지 조회 API 구현 시 S3 URL을 직접 노출하지 않고 CloudFront OAC를 통해
# READY 상태의 watermarkedObjectKey만 전달하도록 아래 설정과 URL 생성 포트 추가
# delivery:
#   cloudfront:
#     enabled: ${AWS_CLOUDFRONT_ENABLED:false}
#     domain: ${AWS_CLOUDFRONT_DOMAIN:}
#     signed-url-expiration: ${AWS_CLOUDFRONT_SIGNED_URL_EXPIRATION:10m}

messaging:
  sqs:
    watermark:
      enabled: ${AWS_SQS_WATERMARK_ENABLED:false}
      queue-url: ${AWS_SQS_WATERMARK_QUEUE_URL:}
      publisher-batch-size: ${AWS_SQS_WATERMARK_PUBLISHER_BATCH_SIZE:10}
      # TODO: Outbox 적체량·SQS SendMessage 지연·DB 잠금 시간을 함께 관찰해 배치와 폴링 주기 조정
      publisher-poll-delay-milliseconds: ${AWS_SQS_WATERMARK_PUBLISHER_POLL_DELAY_MS:1000}
      claim-lease: ${AWS_SQS_WATERMARK_CLAIM_LEASE:60s}
      initial-retry-delay: ${AWS_SQS_WATERMARK_INITIAL_RETRY_DELAY:5s}
      maximum-retry-delay: ${AWS_SQS_WATERMARK_MAXIMUM_RETRY_DELAY:5m}
      worker-poll-delay-milliseconds: ${AWS_SQS_WATERMARK_WORKER_POLL_DELAY_MS:200}
      receive-wait-time-seconds: ${AWS_SQS_WATERMARK_RECEIVE_WAIT_SECONDS:20}
      visibility-timeout-seconds: ${AWS_SQS_WATERMARK_VISIBILITY_TIMEOUT_SECONDS:120}
