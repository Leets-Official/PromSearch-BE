spring:
  jackson:
    time-zone: Asia/Seoul
  flyway:
    # 단위·슬라이스 테스트는 JPA 테스트 픽스처를 사용하며 운영 마이그레이션은 별도 테스트에서 검증한다.
    enabled: false

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLE:false}
    path: /docs-json
  swagger-ui:
    enabled: ${SWAGGER_ENABLE:false}
    path: /docs
    persist-authorization: true
    try-it-out-enabled: true

prompt:
  pricing:
    premium-price-point: 100

auth:
  jwt:
    access-secret: promsearch-test-access-secret-with-at-least-32-bytes
    refresh-secret: promsearch-test-refresh-secret-with-at-least-32-bytes
    access-token-expiration-seconds: 3600
    refresh-token-expiration-seconds: 1209600
  oauth:
    kakao:
      client-id: test-kakao-client-id
      client-secret: test-kakao-client-secret
      token-uri: https://kauth.kakao.com/oauth/token
      user-info-uri: https://kapi.kakao.com/v2/user/me
    google:
      client-id: test-google-client-id
      client-secret: test-google-client-secret
      token-uri: https://oauth2.googleapis.com/token
      user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo

storage:
  s3:
    bucket: promsearch-test-bucket
    region: ap-northeast-2
    original-prefix: prompt-images/original
    watermarked-prefix: prompt-images/watermarked
    profile-prefix: profile-images
    upload-url-expiration: 10m
